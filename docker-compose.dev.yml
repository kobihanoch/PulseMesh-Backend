name: pulsemesh-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pulsemesh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5434:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pulsemesh']
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8
    ports:
      - '27017:27017'
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    container_name: server
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.development
    environment:
      NODE_ENV: development
      PORT: 5000
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@postgres:5432/pulsemesh
      DATABASE_URL: postgres://app_runtime:devpassword@postgres:5432/pulsemesh
      MONGODB_URL: mongodb://mongo:27017
    command: sh -c "npm run db:migrate && npm run dev"
    ports:
      - '5000:5000'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  postgres_dev_data:
  mongo_dev_data:
